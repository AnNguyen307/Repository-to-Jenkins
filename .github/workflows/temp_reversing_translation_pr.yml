name: Temporary Reversing Translation PR

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  translate:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install --quiet requests pymupdf python-docx
      - name: Translate complete book and build files
        run: |
          sed -i "/^token_re=/ s/',re.I)/')/" scripts/temp_translate_reversing_fast.py
          sed -i "s/f'ZXQKEEP/f'zxqkeep/g" scripts/temp_translate_reversing_fast.py
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/temp_translate_reversing_fast.py')
          s=p.read_text(encoding='utf-8')
          old="    text='\\n'.join(out).strip()\n    text=re.sub(r'(?<=\\w)-\\n(?=\\w)','',text)\n    return text\n"
          new="    text='\\n'.join(out).strip()\n    text=re.sub(r'(?<=\\w)-\\n\\s*(?=\\w)','',text)\n    normalized=[]\n    for block in re.split(r'\\n\\s*\\n',text):\n        block=block.strip()\n        if not block:\n            continue\n        normalized.append(block if codeish(block) else re.sub(r'\\s+',' ',block))\n    return '\\n\\n'.join(normalized)\n"
          if old not in s:
              raise RuntimeError('Expected clean() block was not found')
          p.write_text(s.replace(old,new),encoding='utf-8')
          PY
          python scripts/temp_translate_reversing_fast.py
      - name: Upload translation artifact
        uses: actions/upload-artifact@v4
        with:
          name: reversing-vi-translation
          path: translation_output/
          retention-days: 1
