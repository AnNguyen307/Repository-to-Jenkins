name: Temporary Reversing Translation PR

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  translate:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install --quiet requests pymupdf python-docx
      - name: Translate complete book and build files
        run: python scripts/temp_translate_reversing.py
      - name: Upload translation artifact
        uses: actions/upload-artifact@v4
        with:
          name: reversing-vi-translation
          path: translation_output/
          retention-days: 1
